<div class="brand-rule sticky top-0 z-30" aria-hidden="true"></div>

<a href="#contenido" class="skip-link">Saltar al contenido</a>

<!-- Phone and tablet: compact bar with the menu button -->
<header
  class="sticky top-2 z-20 flex h-16 items-center justify-between border-b border-line bg-white px-4 lg:hidden"
>
  <img
    ngSrc="brand/logo.webp"
    width="600"
    height="253"
    alt="Elpidio Jr. Produce Co."
    class="h-10 w-auto"
  />
  <button
    type="button"
    class="btn-icon"
    aria-controls="navegacion"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    (click)="menuOpen.set(!menuOpen())"
  >
    @if (menuOpen()) {
      <svg lucideX class="size-5" aria-hidden="true"></svg>
    } @else {
      <svg lucideMenu class="size-5" aria-hidden="true"></svg>
    }
  </button>
</header>

@if (menuOpen()) {
  <div
    class="fixed inset-0 z-30 bg-ink/40 lg:hidden"
    aria-hidden="true"
    (click)="menuOpen.set(false)"
  ></div>
}

<div class="lg:grid lg:grid-cols-[16.5rem_minmax(0,1fr)]">
  <aside
    id="navegacion"
    class="fixed inset-y-0 left-0 z-40 flex w-[17rem] flex-col border-r border-line bg-white transition-transform duration-200 ease-out lg:sticky lg:top-2 lg:z-auto lg:h-[calc(100dvh-0.5rem)] lg:w-auto lg:translate-x-0"
    [class.-translate-x-full]="!menuOpen()"
    [class.max-lg:invisible]="!menuOpen()"
    aria-label="Secciones"
  >
    <div class="px-6 pt-7 pb-6">
      <img
        ngSrc="brand/logo.webp"
        width="600"
        height="253"
        priority
        alt="Elpidio Jr. Produce Co."
        class="h-auto w-full max-w-[13.5rem]"
      />
      <p class="mt-2 text-xs text-ink-muted">5400 NW 32nd Ct · Miami, FL</p>
    </div>

    <nav class="flex-1 overflow-y-auto px-3">
      <ul class="space-y-1">
        @for (item of navItems; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              ariaCurrentWhenActive="page"
              class="nav-link"
            >
              <svg
                [lucideIcon]="item.icon"
                class="size-[1.125rem] shrink-0"
                aria-hidden="true"
              ></svg>
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    @if (user(); as u) {
      <div class="m-3 flex items-center gap-3 rounded-xl bg-canvas p-3">
        <span
          class="grid size-9 shrink-0 place-items-center rounded-full bg-brand-600 text-sm font-bold text-white"
          aria-hidden="true"
          >{{ initials() }}</span
        >
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-semibold text-ink">{{ u.displayName }}</p>
          <p class="truncate text-xs text-ink-muted">{{ u.email }}</p>
        </div>
        <button
          type="button"
          class="btn-icon size-9"
          aria-label="Cerrar sesión"
          title="Cerrar sesión"
          (click)="logout()"
        >
          <svg lucideLogOut class="size-[1.125rem]" aria-hidden="true"></svg>
        </button>
      </div>
    }
  </aside>

  <main
    id="contenido"
    tabindex="-1"
    class="min-w-0 px-4 py-8 outline-none sm:px-8 lg:px-10 lg:py-10"
  >
    <router-outlet />
  </main>
</div>
